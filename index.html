<!DOCTYPE html>
<!--
  FaceMatrix — live face recognition in the browser.
  Deploy: push this single file as index.html to a GitHub repo and enable Pages.
  Camera access needs HTTPS (or localhost) — GitHub Pages serves HTTPS automatically.
  Everything runs client-side: no backend, no data leaves the device.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FaceMatrix — Live Face Recognition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  :root {
    --bg: #0a0d12;
    --bg-2: #131a2a;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.1);
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --good: #34d399;
    --warn: #f5a524;
    --bad: #ef4444;
    --text: #e8eaf0;
    --text-dim: #8b93a7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at top, var(--bg-2), var(--bg) 65%);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }
  #app { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; }

  header { padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: 0.2px; }
  header h1 span { color: var(--accent-2); }
  #statusPill {
    font-size: 11px; font-weight: 500; color: var(--text-dim);
    background: var(--glass); border: 1px solid var(--glass-border);
    padding: 5px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px;
  }
  #statusDot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); transition: background .3s; }

  #stage { position: relative; flex: 1; margin: 4px 12px; border-radius: 20px; overflow: hidden; background: #000; border: 1px solid var(--glass-border); }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #video { transform: scaleX(-1); }

  #scanline {
    position: absolute; left: 4%; right: 4%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
    box-shadow: 0 0 12px var(--accent-2); animation: sweep 2.2s ease-in-out infinite;
    opacity: 0; pointer-events: none;
  }
  #stage.loading #scanline { opacity: 1; }
  @keyframes sweep { 0%{top:8%} 50%{top:92%} 100%{top:8%} }

  #loadingOverlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(10,13,18,0.78); backdrop-filter: blur(6px); z-index: 4; transition: opacity .4s ease;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  #loadingOverlay p { font-size: 12.5px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; text-align: center; padding: 0 24px; }

  #vectorReadout {
    position: absolute; bottom: 10px; left: 10px; right: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--accent-2);
    background: rgba(10,13,18,0.6); border: 1px solid var(--glass-border);
    border-radius: 10px; padding: 8px 10px; line-height: 1.5; opacity: 0; transition: opacity .3s;
  }
  #vectorReadout.show { opacity: 1; }
  #vectorReadout .dim { color: var(--text-dim); }

  #dock { margin: 4px 12px 12px; padding: 14px; border-radius: 20px; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(16px); }
  #registerRow { display: flex; gap: 8px; }
  #nameInput {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.04); color: var(--text); font-family: inherit; font-size: 14px; outline: none;
  }
  #nameInput:focus { border-color: var(--accent); }
  #registerBtn {
    padding: 12px 18px; border-radius: 12px; border: none; font-family: inherit; font-weight: 600; font-size: 14px;
    background: linear-gradient(135deg, var(--accent), #5b3df0); color: white; cursor: pointer; white-space: nowrap;
  }
  #registerBtn:disabled { opacity: 0.35; }
  #registerBtn:active:not(:disabled) { transform: scale(0.97); }

  #peopleList { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); padding: 6px 6px 6px 12px; border-radius: 20px; color: var(--text); }
  .chip button { background: none; border: none; color: var(--text-dim); font-size: 15px; cursor: pointer; width: 18px; height: 18px; line-height: 1; border-radius: 50%; }
  .chip button:active { background: rgba(255,255,255,0.1); }
  #emptyHint { font-size: 12px; color: var(--text-dim); margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Face<span>Matrix</span></h1>
    <div id="statusPill"><span id="statusDot"></span><span id="statusText">Loading models…</span></div>
  </header>

  <div id="stage" class="loading">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="scanline"></div>
    <div id="vectorReadout"></div>
    <div id="loadingOverlay">
      <p id="loadingText">Loading detection model…</p>
    </div>
  </div>

  <div id="dock">
    <div id="registerRow">
      <input id="nameInput" type="text" placeholder="Name this face…" maxlength="24">
      <button id="registerBtn" disabled>Register</button>
    </div>
    <div id="peopleList"></div>
    <div id="emptyHint">No faces registered yet — look at the camera and register yourself.</div>
  </div>
</div>

<script>
(async function () {
  // jsDelivr mirrors the face-api.js GitHub repo's /weights folder with proper CORS headers,
  // so the pretrained models can be fetched straight from here — no self-hosting needed.
  const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights';

  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');
  const nameInput = document.getElementById('nameInput');
  const registerBtn = document.getElementById('registerBtn');
  const peopleList = document.getElementById('peopleList');
  const emptyHint = document.getElementById('emptyHint');
  const vectorReadout = document.getElementById('vectorReadout');

  const MATCH_THRESHOLD = 0.6; // face-api's standard cutoff for "same person" on 128-D descriptors
  let registeredFaces = [];    // [{ name, descriptor: Float32Array(128) }]
  let latestDetections = [];
  let running = false;

  function setStatus(text, color) {
    statusText.textContent = text;
    statusDot.style.background = color;
  }

  // ---- This is the actual matrix/vector math the whole system rests on ----
  // Each face becomes a 128-D vector. "Recognizing" a face is just measuring
  // the distance between two vectors — the smaller the distance, the more
  // similar the faces. No lookup tables, no if-statements about eye color —
  // just linear algebra.
  function euclideanDistance(vecA, vecB) {
    let sumSq = 0;
    for (let i = 0; i < vecA.length; i++) {
      const diff = vecA[i] - vecB[i];
      sumSq += diff * diff;
    }
    return Math.sqrt(sumSq);
  }

  function findBestMatch(descriptor) {
    let best = { name: null, distance: Infinity };
    for (const person of registeredFaces) {
      const d = euclideanDistance(descriptor, person.descriptor);
      if (d < best.distance) best = { name: person.name, distance: d };
    }
    return best;
  }

  function drawCornerBox(x, y, w, h, color) {
    const len = Math.max(14, Math.min(w, h) * 0.18);
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len); ctx.stroke();
  }

  function renderPeopleList() {
    peopleList.innerHTML = '';
    emptyHint.style.display = registeredFaces.length ? 'none' : 'block';
    registeredFaces.forEach((p, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = p.name;
      const del = document.createElement('button');
      del.textContent = '×';
      del.onclick = () => { registeredFaces.splice(i, 1); renderPeopleList(); };
      chip.appendChild(label);
      chip.appendChild(del);
      peopleList.appendChild(chip);
    });
  }

  async function loadModels() {
    const steps = [
      ['Loading detection model…', faceapi.nets.tinyFaceDetector],
      ['Loading landmark model…', faceapi.nets.faceLandmark68Net],
      ['Loading recognition model… (~6MB, one-time)', faceapi.nets.faceRecognitionNet],
    ];
    for (const [label, net] of steps) {
      loadingText.textContent = label;
      await net.loadFromUri(MODEL_URL);
    }
  }

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await new Promise(resolve => { video.onloadedmetadata = resolve; });
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  async function detectLoop() {
    if (!running) return;
    const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
    const results = await faceapi.detectAllFaces(video, options).withFaceLandmarks().withFaceDescriptors();
    latestDetections = results;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.length === 0) {
      setStatus('No face detected', 'var(--warn)');
      vectorReadout.classList.remove('show');
      registerBtn.disabled = true;
    } else {
      results.forEach((det, idx) => {
        const { x, y, width, height } = det.detection.box;
        // The video is mirrored via CSS for a natural selfie view, but this canvas
        // isn't — so we mirror the box's x-coordinate ourselves to keep it aligned.
        const boxX = canvas.width - x - width;

        let color = 'var(--warn)', label = 'Unregistered';
        if (registeredFaces.length > 0) {
          const match = findBestMatch(det.descriptor);
          if (match.distance < MATCH_THRESHOLD) {
            color = 'var(--good)';
            label = `${match.name} · ${match.distance.toFixed(3)}`;
          } else {
            label = `Unknown · ${match.distance.toFixed(3)}`;
          }
        }
        const resolvedColor = getComputedStyle(document.documentElement).getPropertyValue(color.replace('var(', '').replace(')', '')).trim() || color;

        drawCornerBox(boxX, y, width, height, resolvedColor);
        ctx.font = '600 13px "Space Grotesk", sans-serif';
        const textWidth = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(10,13,18,0.75)';
        ctx.fillRect(boxX, Math.max(0, y - 28), textWidth + 16, 22);
        ctx.fillStyle = resolvedColor;
        ctx.fillText(label, boxX + 8, Math.max(16, y - 12));

        if (idx === 0) {
          const preview = Array.from(det.descriptor.slice(0, 6)).map(v => v.toFixed(2)).join(', ');
          const nearest = registeredFaces.length ? findBestMatch(det.descriptor).distance.toFixed(4) : '—';
          vectorReadout.innerHTML = `<span class="dim">128-D vector:</span> [${preview}, …]<br><span class="dim">nearest distance:</span> ${nearest}`;
          vectorReadout.classList.add('show');
        }
      });
      registerBtn.disabled = nameInput.value.trim().length === 0;
      setStatus(registeredFaces.length ? 'Scanning' : 'Face detected — register it below', 'var(--accent-2)');
    }

    setTimeout(detectLoop, 150); // throttled so mobile CPUs aren't maxed out
  }

  registerBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name || latestDetections.length === 0) return;
    registeredFaces.push({ name, descriptor: latestDetections[0].descriptor });
    nameInput.value = '';
    registerBtn.disabled = true;
    renderPeopleList();
  });
  nameInput.addEventListener('input', () => {
    registerBtn.disabled = nameInput.value.trim().length === 0 || latestDetections.length === 0;
  });

  try {
    await loadModels();
    await startCamera();
    stage.classList.remove('loading');
    loadingOverlay.classList.add('hidden');
    setStatus('Ready', 'var(--good)');
    running = true;
    detectLoop();
  } catch (err) {
    loadingText.textContent = err.name === 'NotAllowedError'
      ? 'Camera permission denied — allow access and reload the page.'
      : 'Setup failed: ' + err.message;
    setStatus('Error', 'var(--bad)');
  }
})();
</script>
</body>
</html>
